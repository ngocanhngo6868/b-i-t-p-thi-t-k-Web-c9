<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <title>Display a random image with jQuery</title>
    <!-- Liên kết đến file CSS trong thư mục Styles -->
    <link rel="stylesheet" href="Styles/style.css">
</head>
<body>

    <div class="container">
        <h2>Hiển thị hình ảnh ngẫu nhiên bằng jQuery</h2>
        
        <div>
            <!-- Nút bấm gọi hàm display_random_image() -->
            <button id="jsstyle">Show Image</button>
        </div>

        <!-- Khu vực chứa hình ảnh ngẫu nhiên xuất ra -->
        <div id="image-container"></div>
    </div>

    <!-- Nhúng thư viện jQuery từ thư mục Scripts -->
    <script src="Scripts/jquery.min.js"></script>
    <!-- Liên kết đến file JavaScript trong thư mục Scripts -->
    <script src="Scripts/script.js"></script>
</body>
</html>
