<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <style type="text/css">
        body {margin: 30px;}
    </style>
    <title>Count and display items of a dropdown list w3resource with jQuery</title>
    <!-- Liên kết đến file CSS trong thư mục Styles -->
    <link rel="stylesheet" href="Styles/style.css">
</head>
<body>

    <div class="container">
        <h2>Đếm và hiển thị tất cả các mục trong Dropdown List bằng jQuery</h2>
        
        <form>
            Select your favorite Color :
            <select id="mySelect">
                <option>Red</option>
                <option>Green</option>
                <option>Blue</option>
                <option>White</option>
            </select><br><br>
            <!-- Nút bấm gọi hàm getOptions() -->
            <input type="button" id="countBtn" value="Count and Output all items">
        </form>
    </div>

    <!-- Nhúng thư viện jQuery từ thư mục Scripts -->
    <script src="Scripts/jquery.min.js"></script>
    <!-- Liên kết đến file JavaScript trong thư mục Scripts -->
    <script src="Scripts/script.js"></script>
</body>
</html>
