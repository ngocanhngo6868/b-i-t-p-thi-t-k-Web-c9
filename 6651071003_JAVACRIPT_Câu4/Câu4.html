<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <title>Remove items from a dropdown list with jQuery</title>
    <!-- Liên kết đến file CSS trong thư mục Styles -->
    <link rel="stylesheet" href="Styles/style.css">
</head>
<body>

    <div class="container">
        <h2>Xóa lựa chọn trong Dropdown List bằng jQuery</h2>
        
        <form>
            <select id="colorSelect">
                <option>Red</option>
                <option>Green</option>
                <option>White</option>
                <option>Black</option>
            </select><br><br>
            <!-- Nút bấm gọi hàm removecolor() -->
            <input type="button" id="removeBtn" value="Select and Remove">
        </form>
    </div>

    <!-- Nhúng thư viện jQuery từ thư mục Scripts -->
    <script src="Scripts/jquery.min.js"></script>
    <!-- Liên kết đến file JavaScript trong thư mục Scripts -->
    <script src="Scripts/script.js"></script>
</body>
</html>
