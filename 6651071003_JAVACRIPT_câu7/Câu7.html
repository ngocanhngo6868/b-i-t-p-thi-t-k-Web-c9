<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển hướng đến đường link với jQuery</title>
    <!-- Liên kết đến file CSS trong thư mục Styles -->
    <link rel="stylesheet" href="Styles/style.css">
</head>
<body>

    <div class="container">
        <h1>Nhập đường link và nhấn "Submit" để chuyển hướng:</h1>
        <form id="linkForm">
            <input type="text" id="linkInput" placeholder="Nhập đường link (VD: https://google.com)">
            <button type="submit">Submit</button>
        </form>
    </div>

    <!-- Nhúng thư viện jQuery từ thư mục Scripts -->
    <script src="Scripts/jquery.min.js"></script>
    <!-- Liên kết đến file JavaScript trong thư mục Scripts -->
    <script src="Scripts/script.js"></script>
</body>
</html>
